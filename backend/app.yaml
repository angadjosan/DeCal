runtime: nodejs20

service: backend

env_variables:
  NODE_ENV: "production"
  GCP_PROJECT: "decal-478508"

handlers:
  - url: /.*
    secure: always
    script: auto

automatic_scaling:
  # Kept warm: with min_instances at 0 the first request after an idle period
  # paid a cold start (Node boot + Secret Manager fetch + Supabase client init),
  # and the in-process course cache was thrown away on every scale-to-zero.
  min_instances: 1
  max_instances: 5